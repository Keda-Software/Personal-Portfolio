<style>
/* Layout concept: dark navy "workbench". One oversized name in the hero, a profile card with floating
   stack chips, then calm full-width bands. Boldness lives in the hero type; everything else stays quiet. */
:root {
  --ink: #060A18;
  --panel: #0C1226;
  --panel-2: #121A38;
  --line: rgba(140, 160, 255, 0.15);
  --text: #EEF1FF;
  --muted: #9CA6C9;
  --blue: #5B8CFF;
  --violet: #9B7BFF;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html { scroll-behavior: smooth; scroll-padding-top: 84px; background: var(--ink); }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--mono); }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.muted { color: var(--muted); }
.grad-text { background: linear-gradient(100deg, var(--blue), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grid-bg { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 25% 20%, #000 0%, transparent 75%); mask-image: radial-gradient(ellipse 70% 80% at 25% 20%, #000 0%, transparent 75%); }
.glow-a { background: radial-gradient(closest-side, rgba(91,140,255,.28), transparent); }
.glow-b { background: radial-gradient(closest-side, rgba(155,123,255,.24), transparent); }
.panel { background: var(--panel); border: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; transition: transform .25s ease, border-color .25s ease, background .25s ease; }
.card:hover { transform: translateY(-4px); border-color: rgba(120,150,255,.5); background: var(--panel-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .8rem 1.35rem; border-radius: 12px; font-weight: 600; font-size: .95rem; cursor: pointer; border: 1px solid transparent; transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; font-family: var(--body); }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: linear-gradient(100deg, #3F6FF0, #7A58F0); color: #fff; box-shadow: 0 10px 30px -10px rgba(91,110,255,.7); }
.btn-primary:hover { box-shadow: 0 14px 34px -8px rgba(110,110,255,.85); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn-ghost:hover { border-color: var(--blue); background: rgba(91,140,255,.08); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--mono); font-size: .72rem; padding: .22rem .6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.02); }
.chip-ph { color: #C9B8FF; border-color: rgba(155,123,255,.45); background: rgba(155,123,255,.08); }
.eyebrow { font-family: var(--mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: .75rem; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--blue); }
.nav-link { position: relative; padding: .4rem .1rem; color: var(--muted); font-size: .92rem; font-weight: 500; transition: color .2s; }
.nav-link:hover, .nav-link[aria-current="true"] { color: var(--text); }
.nav-link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: linear-gradient(90deg, var(--blue), var(--violet)); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
.nav-link:hover::after, .nav-link[aria-current="true"]::after { transform: scaleX(1); }
.field { width: 100%; box-sizing: border-box; background: var(--ink); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: .8rem 1rem; font: inherit; transition: border-color .2s, box-shadow .2s; }
.field::placeholder { color: #6C769B; }
.field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(91,140,255,.25); }
.field[aria-invalid="true"] { border-color: #FF7A90; }
.err { color: #FF9AAA; font-size: .85rem; margin-top: .35rem; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--violet)); transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.float-a { animation: bob 6s ease-in-out infinite; }
.float-b { animation: bob 7.5s ease-in-out -2s infinite; }
.pulse { animation: pulse 2s ease-in-out infinite; }
.spin { animation: spin 1s linear infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.timeline { position: relative; }
.timeline::before { content: ""; position: absolute; left: 19px; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(var(--blue), var(--violet), transparent); }
.cover { position: relative; overflow: hidden; height: 120px; display: flex; align-items: center; justify-content: center; }
.cover::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

    { type: "Training", icon: "Cloud", title: "AI and Cloud Architecture", org: "Self-directed learning", period: "In progress", text: "Learning how to design and deploy scalable systems, and how AI fits into them." },
    { type: "Certification", icon: "Award", title: "Microsoft and AWS courses", org: "Course taker", period: "[Year]", text: "[Add the exact course or certificate names and completion dates here.]" },

/* =====================================================================
   2. SMALL HELPERS
   ===================================================================== */
const Lib = window.lucideReact || window.LucideReact || {};
const Icon = ({ name, size = 20, ...rest }) => {
  const C = Lib[name];
  return C ? <C size={size} aria-hidden="true" {...rest} /> : <span style={{ width: size, height: size, display: "inline-block" }} />;
};

const NAV = [
  ["home", "Home"], ["about", "About"], ["skills", "Skills"], ["projects", "Projects"],
  ["experience", "Experience"], ["services", "Services"], ["contact", "Contact"],
];

const goTo = (id) => {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
};

const socialLinks = () => [
  { label: "GitHub", icon: "Github", url: DATA.github },
  { label: "LinkedIn", icon: "Linkedin", url: DATA.linkedin },
  ...DATA.extraSocials,
].filter((s) => s.url);

function Placeholder({ children = "Placeholder" }) {
  return DATA.showPlaceholderNotes ? <span className="chip chip-ph">{children}</span> : null;
}

function SectionHead({ eyebrow, title, intro, note }) {
  return (
    <div className="mb-10 md:mb-14 max-w-2xl">
      <p className="eyebrow">{eyebrow}</p>
      <h2 className="mt-4 text-3xl md:text-5xl font-extrabold tracking-tight leading-[1.08]">{title}</h2>
      {intro && <p className="muted mt-4 text-lg">{intro}</p>}
      {note && DATA.showPlaceholderNotes && <p className="mt-4"><span className="chip chip-ph">{note}</span></p>}
    </div>
  );
}

/* =====================================================================
   3. NAVIGATION
   ===================================================================== */
function Navbar() {
  const [active, setActive] = useState("home");
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setActive(e.target.id)),
      { rootMargin: "-45% 0px -50% 0px" }
    );
    NAV.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  const click = (id) => (e) => { e.preventDefault(); setOpen(false); goTo(id); };
  const initials = DATA.name.split(" ").map((w) => w[0]).join("").slice(0, 2);

  return (
    <header
      style={{ position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 50, background: scrolled || open ? "rgba(6,10,24,.88)" : "transparent", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", borderBottom: scrolled || open ? "1px solid var(--line)" : "1px solid transparent", transition: "background .3s, border-color .3s" }}
    >
      <div className="wrap flex items-center justify-between h-16">
        <a href="#home" onClick={click("home")} className="flex items-center gap-3 font-display font-extrabold text-lg" aria-label={DATA.name + " home"}>
          <span className="grid place-items-center w-9 h-9 rounded-xl text-sm" style={{ background: "linear-gradient(135deg,#3F6FF0,#7A58F0)" }}>{initials}</span>
          <span className="hidden sm:inline">{DATA.name}</span>
        </a>
        <nav className="hidden lg:flex items-center gap-7" aria-label="Primary">
          {NAV.slice(0, -1).map(([id, label]) => (
            <a key={id} href={"#" + id} onClick={click(id)} className="nav-link" aria-current={active === id}>{label}</a>
          ))}
          <a href="#contact" onClick={click("contact")} className="btn btn-primary" style={{ padding: ".55rem 1.1rem" }}>Contact</a>
        </nav>
        <button className="lg:hidden grid place-items-center w-11 h-11 rounded-xl" style={{ border: "1px solid var(--line)" }} onClick={() => setOpen(!open)} aria-expanded={open} aria-controls="mobile-menu" aria-label={open ? "Close menu" : "Open menu"}>
          <Icon name={open ? "X" : "Menu"} />
        </button>
      </div>
      {open && (
        <nav id="mobile-menu" className="lg:hidden wrap pb-5 flex flex-col" aria-label="Mobile">
          {NAV.map(([id, label]) => (
            <a key={id} href={"#" + id} onClick={click(id)} className="py-3 text-lg font-medium" style={{ borderTop: "1px solid var(--line)", color: active === id ? "var(--text)" : "var(--muted)" }}>{label}</a>
          ))}
        </nav>
      )}
    </header>
  );
}

          </p>

            {first}<br /><span className="grad-text">{rest.join(" ")}</span>
          </h1>
          <p className="rise mt-7 text-xl md:text-2xl font-display font-medium" style={{ animationDelay: ".25s" }}>
            {DATA.title} who builds the whole product.
          </p>
          <p className="rise muted mt-4 text-lg max-w-xl" style={{ animationDelay: ".35s" }}>{DATA.intro}</p>
          <div className="rise mt-9 flex flex-wrap gap-3" style={{ animationDelay: ".45s" }}>
            <a href="#projects" onClick={(e) => { e.preventDefault(); goTo("projects"); }} className="btn btn-primary">View My Projects <Icon name="ArrowRight" size={18} /></a>
            <a href="#contact" onClick={(e) => { e.preventDefault(); goTo("contact"); }} className="btn btn-ghost"><Icon name="Mail" size={18} /> Contact Me</a>
          </div>

            {stats.map(([n, l]) => (

          <div className="panel relative rounded-[28px] overflow-hidden aspect-[4/5]">

                <div>
                  <div className="mx-auto grid place-items-center w-28 h-28 rounded-full font-display font-extrabold text-4xl" style={{ background: "linear-gradient(135deg,#3F6FF0,#7A58F0)" }}>

                  <p className="mt-1 text-xs muted">Set <span className="mono">DATA.photo</span> to your image</p>
                </div>
              </div>
            )}
          </div>
          <div className="float-a panel absolute -left-3 sm:-left-8 top-10 rounded-2xl px-4 py-3 flex items-center gap-3" style={{ background: "rgba(12,18,38,.92)" }}>
            <Icon name="Atom" size={18} style={{ color: "var(--blue)" }} /><span className="mono text-sm">React</span>
          </div>
          <div className="float-b panel absolute -right-2 sm:-right-6 top-1/2 rounded-2xl px-4 py-3 flex items-center gap-3" style={{ background: "rgba(12,18,38,.92)" }}>

/* =====================================================================
   10. CONTACT (with validation and loading state)
   ===================================================================== */
const EMPTY = { name: "", email: "", subject: "", message: "" };

function validate(v) {
  const e = {};
  if (v.name.trim().length < 2) e.name = "Enter your name (at least 2 characters).";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email.trim())) e.email = "Enter a valid email address, like name@example.com.";
  if (v.subject.trim().length < 3) e.subject = "Add a short subject (at least 3 characters).";
  if (v.message.trim().length < 10) e.message = "Write at least 10 characters so I know how to help.";
  return e;
}

function Field({ id, label, error, children }) {
  return (
    <div>
      <label htmlFor={id} className="block text-sm font-semibold mb-2">{label}</label>
      {children}
      {error && <p id={id + "-err"} className="err" role="alert">{error}</p>}
    </div>
  );
}

function Contact() {
  const [values, setValues] = useState(EMPTY);
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [status, setStatus] = useState("idle"); // idle | loading | ready | sent | error
  const [copied, setCopied] = useState("");
  const draftRef = useRef(null);

  const set = (k) => (e) => {
    const next = { ...values, [k]: e.target.value };
    setValues(next);
    if (touched[k]) setErrors(validate(next));
  };
  const blur = (k) => () => { setTouched({ ...touched, [k]: true }); setErrors(validate(values)); };
  const show = (k) => (touched[k] ? errors[k] : undefined);

  const draft = "To: " + DATA.email + "\nSubject: " + values.subject.trim() + "\n\nHi " + DATA.name.split(" ")[0] + ",\n\n" + values.message.trim() + "\n\nFrom " + values.name.trim() + " (" + values.email.trim() + ")";

  const submit = async (e) => {
    e.preventDefault();
    const found = validate(values);
    setErrors(found);
    setTouched({ name: true, email: true, subject: true, message: true });
    if (Object.keys(found).length) {
      const first = ["name", "email", "subject", "message"].find((k) => found[k]);
      const el = document.getElementById("f-" + first);
      if (el) el.focus();
      return;
    }
    setStatus("loading");
    if (DATA.formEndpoint) {
      try {
        const res = await fetch(DATA.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(values) });
        setStatus(res.ok ? "sent" : "error");
      } catch (err) { setStatus("error"); }
      return;
    }
    setTimeout(() => setStatus("ready"), 700);
  };

  const doCopy = async (key, text) => {
    const ok = await copyText(text);
    if (ok) { setCopied(key); setTimeout(() => setCopied(""), 2000); }
    else if (key === "draft" && draftRef.current) { draftRef.current.focus(); draftRef.current.select(); setCopied("manual"); }
  };

  const reset = () => { setValues(EMPTY); setErrors({}); setTouched({}); setStatus("idle"); };
  const mailHref = "mailto:" + DATA.email + "?subject=" + encodeURIComponent(values.subject) + "&body=" + encodeURIComponent(values.message);

  return (
    <section id="contact" className="py-20 md:py-28" style={{ background: "linear-gradient(180deg, transparent, rgba(12,18,38,.8))" }}>
      <div className="wrap">
        <SectionHead eyebrow="Contact" title="Let's build something." intro="Send a message about a project, a course, or a chance to work together." />
        <div className="grid lg:grid-cols-[1fr_1.2fr] gap-8">
          <div className="flex flex-col gap-4 min-w-0">
            <div className="card p-5 flex items-center gap-4" style={{ transform: "none" }}>
              <span className="grid place-items-center w-11 h-11 rounded-xl shrink-0" style={{ background: "rgba(91,140,255,.12)", color: "var(--blue)" }}><Icon name="Mail" size={20} /></span>
              <div className="min-w-0 flex-1">
                <p className="mono text-xs muted uppercase tracking-widest">Email</p>
                <a href={"mailto:" + DATA.email} className="font-semibold break-all hover:underline">{DATA.email}</a>
              </div>
              <button type="button" className="btn btn-ghost shrink-0" style={{ padding: ".5rem .7rem" }} onClick={() => doCopy("email", DATA.email)} aria-label="Copy email address">
                <Icon name={copied === "email" ? "Check" : "Copy"} size={16} />
              </button>
            </div>
            <div className="card p-5 flex items-center gap-4" style={{ transform: "none" }}>
              <span className="grid place-items-center w-11 h-11 rounded-xl shrink-0" style={{ background: "rgba(155,123,255,.12)", color: "var(--violet)" }}><Icon name="Phone" size={20} /></span>
              <div className="min-w-0">
                <p className="mono text-xs muted uppercase tracking-widest">Phone</p>
                <p className="font-semibold break-words">{DATA.phone}</p>
              </div>
            </div>
            <div className="card p-5 flex items-center gap-4" style={{ transform: "none" }}>
              <span className="grid place-items-center w-11 h-11 rounded-xl shrink-0" style={{ background: "rgba(91,140,255,.12)", color: "var(--blue)" }}><Icon name="MapPin" size={20} /></span>
              <div>
                <p className="mono text-xs muted uppercase tracking-widest">Location</p>
                <p className="font-semibold">{DATA.location}</p>
              </div>
            </div>
            <div className="flex flex-wrap gap-3 mt-2">
              {socialLinks().map((s) => (
                <a key={s.label} href={s.url} target="_blank" rel="noopener noreferrer" className="btn btn-ghost"><Icon name={s.icon} size={18} /> {s.label}</a>
              ))}
            </div>
          </div>

          <div className="panel rounded-[22px] p-6 md:p-8 min-w-0">
            {status === "ready" || status === "sent" ? (
              <div role="status">
                <span className="grid place-items-center w-12 h-12 rounded-full" style={{ background: "rgba(74,222,154,.14)", color: "#4ADE9A" }}><Icon name="Check" size={24} /></span>
                {status === "sent" ? (
                  <>
                    <h3 className="text-2xl font-bold mt-5">Message sent</h3>
                    <p className="muted mt-2">Thanks, {values.name.split(" ")[0]}. You'll get a reply at {values.email}.</p>
                  </>
                ) : (
                  <>
                    <h3 className="text-2xl font-bold mt-5">Your message is ready</h3>
                    <p className="muted mt-2">This site has no mail server connected, so nothing was sent yet. Copy the message below and email it to {DATA.email}.</p>
                    <label htmlFor="draft" className="sr-only">Your message</label>
                    <textarea id="draft" ref={draftRef} readOnly value={draft} rows={8} className="field mono mt-5" style={{ fontSize: ".85rem" }} />
                    <div className="flex flex-wrap gap-3 mt-4">
                      <button type="button" className="btn btn-primary" onClick={() => doCopy("draft", draft)}><Icon name={copied === "draft" ? "Check" : "Copy"} size={16} /> {copied === "draft" ? "Copied" : "Copy message"}</button>
                      <a className="btn btn-ghost" href={mailHref}><Icon name="Mail" size={16} /> Open in email app</a>
                    </div>
                    {copied === "manual" && <p className="muted text-sm mt-3">Copying is blocked here, so the text is selected. Press Ctrl+C (or Cmd+C) to copy it.</p>}
                  </>
                )}
                <button type="button" className="btn btn-ghost mt-6" onClick={reset}>Write another message</button>
              </div>
            ) : (
              <form onSubmit={submit} noValidate className="flex flex-col gap-5" aria-label="Contact form">
                <div className="grid sm:grid-cols-2 gap-5">
                  <Field id="f-name" label="Name" error={show("name")}>
                    <input id="f-name" className="field" type="text" autoComplete="name" placeholder="Your name" value={values.name} onChange={set("name")} onBlur={blur("name")} aria-invalid={!!show("name")} aria-describedby={show("name") ? "f-name-err" : undefined} />
                  </Field>
                  <Field id="f-email" label="Email" error={show("email")}>
                    <input id="f-email" className="field" type="email" autoComplete="email" placeholder="you@example.com" value={values.email} onChange={set("email")} onBlur={blur("email")} aria-invalid={!!show("email")} aria-describedby={show("email") ? "f-email-err" : undefined} />
                  </Field>
                </div>
                <Field id="f-subject" label="Subject" error={show("subject")}>
                  <input id="f-subject" className="field" type="text" placeholder="What is this about?" value={values.subject} onChange={set("subject")} onBlur={blur("subject")} aria-invalid={!!show("subject")} aria-describedby={show("subject") ? "f-subject-err" : undefined} />
                </Field>
                <Field id="f-message" label="Message" error={show("message")}>
                  <textarea id="f-message" className="field" rows={6} placeholder="Tell me about your project or idea" value={values.message} onChange={set("message")} onBlur={blur("message")} aria-invalid={!!show("message")} aria-describedby={show("message") ? "f-message-err" : undefined} style={{ resize: "vertical" }} />
                </Field>
                {status === "error" && <p className="err" role="alert">The message could not be sent. Check your connection and try again, or email {DATA.email} directly.</p>}
                <button type="submit" className="btn btn-primary self-start" disabled={status === "loading"}>
                  {status === "loading" ? <><span className="spin inline-flex"><Icon name="Loader2" size={18} /></span> Preparing...</> : <><Icon name="Send" size={18} /> Send message</>}
                </button>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}
